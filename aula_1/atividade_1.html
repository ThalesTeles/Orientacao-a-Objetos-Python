<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- ISTO É UM COMENTÁRIO -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minha primeira página !!</title>
    </head>
    <body>
        <!-- Passo 4: Adicione o cabeçalho da página com o título principal(h1) -->
        <header>
            <h1>Meu blog pessoal</h1>
        </header>

        <!-- Passo 1: Adicione um título(h2) para escrever o seu nome -->
        <h2>Seu nome...</h2>

        <!-- Passo 2: Adicione um parágrafo(<p></p>) para escrever uma sinopse sobre você-->
        <p>Escreva uma pouco sobre você</p>
        <p><b>Este é um trecho em negrito</b></p>

        <!-- Passo 3: Adicione uma lista ordenada(ol) com os seus 3 jogos favoritos em ordem(li) -->
        <h3>Meus jogos favoritos</h3>
        <ul>
            <li>Filme 1</li>
            <li>Filme 2</li>
            <li>Filme 3</li>
        </ul>

        <!-- Passo 5: Adicione uma lista desordenada(ul) com 3 hobbies(li) -->
        <h4>Meu hobbies</h4>
        <ol>
            <li>Hobbie 1</li>
            <li>Hobbie 2</li>
            <li>Hobbie 3</li>
        </ol>

        <!-- Passo 6: Adicione um elemento para guardar a imagem e sua legenga -->
        <figure>

            <!-- Passo 7: Adicione uma imagem -->
            <img src="/home/thales/documents/profia/planos_de_aula/python_3/pictures/logo_profia.png" alt="Imagem sobre...">

            <!-- Passo 8: Adicione uma legenda para a imagem  -->
            <figcaption>Figura 1 - Logo da profia</figcaption>
        </figure>

        <!-- Passo 9: Adicione um rodapé(<footer></footer>) com suas informações -->
        <footer>
            <p> &copy; 2026 - SEU NOME/ todos os direitos reservados. </p>
        </footer>
    </body>
</html>
